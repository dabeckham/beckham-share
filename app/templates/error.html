{% extends "base.html" %}

{% block content %}

    <h1>{{ code }}</h1>
    <p>{{ message }}</p>
    <div class="note-actions"><a class="btn btn-primary" href="/">Back to home</a></div>
  </div>
</section>
{% endblock %}
